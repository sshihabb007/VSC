name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests & package zip
        run: |
          npm run test:unit
          npm run package

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$TAG" ] || [ "$GITHUB_REF_TYPE" != "tag" ]; then
            TAG="${{ inputs.tag }}"
          fi
          ASSET="release/VideoSpeedController-${TAG}.zip"
          if [ ! -f "$ASSET" ]; then
            ASSET="$(ls release/VideoSpeedController-v*.zip | head -n 1)"
          fi
          node scripts/generate-release-notes.mjs "$TAG" "$ASSET" /tmp/release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --title "Video Speed Controller $TAG" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" "$ASSET" --title "Video Speed Controller $TAG" --notes-file /tmp/release-notes.md
          fi
