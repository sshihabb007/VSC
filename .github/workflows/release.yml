name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests & package zip
        run: |
          npm run test:unit
          npm run package

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$TAG" ] || [ "$GITHUB_REF_TYPE" != "tag" ]; then
            TAG="${{ inputs.tag }}"
          fi
          ASSET="release/VideoSpeedController-${TAG}.zip"
          if [ ! -f "$ASSET" ]; then
            ASSET="$(ls release/VideoSpeedController-v*.zip | head -n 1)"
          fi
          NOTES="Lightweight Manifest V3 HTML5 <video> and <audio> speed controller for Google Chrome and Brave Browser.\n\n### Highlights\n- Per-platform & site-wise Controller Positioning Studio (no Custom CSS required)\n- Shadow DOM isolation with constructable CSSStyleSheet & GPU translate3d drag\n- Updated default shortcuts: X (-0.1x), C (+0.1x), S (-5s), D (+5s), Z (1.0x), G (1.6x), V (hide), M/J (mark/jump)\n\n### Quick Install\n1. Download \`$(basename "$ASSET")\` below and extract it.\n2. Open \`chrome://extensions\` or \`brave://extensions\`.\n3. Enable **Developer mode**, click **Load unpacked**, and select the extracted folder."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            printf '%b\n' "$NOTES" > /tmp/release-notes.md
            gh release create "$TAG" "$ASSET" --title "Video Speed Controller $TAG" --notes-file /tmp/release-notes.md
          fi
